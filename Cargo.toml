[workspace]
resolver = "2"
members = ["verbalize", "verbalize-cli", "xtask"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/relu/verbalize"
# Set by the newest dependency floor (icu_* 2.3 requires 1.88); the `msrv` CI
# job checks it against the committed Cargo.lock.
rust-version = "1.88"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
