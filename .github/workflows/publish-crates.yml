# Invoked by release.yml (dist `publish-jobs = ["./publish-crates"]`) after
# every platform artifact has built and `host` has finished, before the
# `announce` job creates the GitHub release; a failed publish here means no
# release is created.
#
# Authenticates via crates.io Trusted Publishing (OIDC): no long-lived token.
# crates.io validates the *calling* workflow's `workflow_ref`, so each crate's
# trusted publisher on crates.io is configured as repo `relu/verbalize`,
# workflow `release.yml`.
name: publish-crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # Re-running after a partial publish resumes: a crate whose exact version
      # is already in the registry index is skipped, not republished.
      # Library first: the CLI's path dependency resolves against the
      # registry once published, so it must already be indexed.
      - name: Publish crates not yet on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          packages="$(cargo metadata --no-deps --format-version 1 --locked)"
          published() {
            # Sparse-index layout for names of four or more characters.
            local crate="$1" version="$2" body status
            body="$(mktemp)"
            status="$(curl -sS --retry 3 -o "$body" -w '%{http_code}' \
              "https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}")"
            case "$status" in
              200) jq -s -e --arg v "$version" 'any(.[]; .vers == $v)' "$body" >/dev/null ;;
              404) return 1 ;;
              *) echo "index lookup for $crate returned HTTP $status" >&2; exit 1 ;;
            esac
          }
          for crate in verbalize verbalize-cli; do
            version="$(jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version' <<<"$packages")"
            if published "$crate" "$version"; then
              echo "$crate $version is already on crates.io; skipping"
            else
              cargo publish -p "$crate" --locked
            fi
          done
