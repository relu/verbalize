# Invoked by release.yml (dist `publish-jobs = ["./publish-crates"]`) after
# every platform artifact has built, before the GitHub release is announced.
#
# Authenticates via crates.io Trusted Publishing (OIDC): no long-lived token.
# crates.io validates the *calling* workflow's `workflow_ref`, so each crate's
# trusted publisher on crates.io is configured as repo `relu/verbalize`,
# workflow `release.yml`.
name: publish-crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # Library first: the CLI's path dependency resolves against the
      # registry once published, so it must already be indexed.
      - run: cargo publish -p verbalize --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: cargo publish -p verbalize-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
