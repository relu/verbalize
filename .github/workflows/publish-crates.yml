# Invoked by release.yml (dist `publish-jobs = ["./publish-crates"]`) after
# every platform artifact has built, before the GitHub release is announced.
# Needs the CARGO_REGISTRY_TOKEN repository secret (crates.io API token with
# publish-new + publish-update scope).
name: publish-crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Library first: the CLI's path dependency resolves against the
      # registry once published, so it must already be indexed.
      - run: cargo publish -p verbalize --locked
      - run: cargo publish -p verbalize-cli --locked
